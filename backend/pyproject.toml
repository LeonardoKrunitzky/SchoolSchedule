    { name = "LeonardoKrunitzky", email = "leonardozkl@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "asyncpg>=0.32.0",
    "bcrypt>=5.0.0",
    "fastapi[all]>=0.162.0",
